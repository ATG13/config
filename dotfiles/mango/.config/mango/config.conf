# DankMaterialShell — MangoWM configuration (managed by `dms setup`)
# Keybinds, colors, layout, outputs, cursor and window rules are pulled from the
# ./dms fragments below. Add your own binds/rules here; they sit alongside DMS's.

env=XDG_CURRENT_DESKTOP,wlroots
env=XDG_SESSION_TYPE,wayland

# exec_once runs only at startup. Do NOT use exec= for the shell: mango re-runs
# every exec= on each config reload, and DMS reloads the config, which would
# spawn a new shell on every reload.
#exec-once=dms run & kanshi -c ~/.config/kanshi/config & open-whispr & disown
exec_once=dms run
exec_once=kanshi
exec_once=~/.config/mango/autostart.sh

# Cycle these layouts on every tag with SUPER+ALT+j (switch_layout)
# Set default layout to dwindle for all tags
tag_rule=id:*,layout_name:dwindle
circle_layout=scroller,dwindle,center_tile
scroller_focus_center=1

# Disable screen edge on scrolling layout
edge_scroller_pointer_focus=0

# scratchpad test
# Send current window to scratchpad

# Toggle (show/hide) the scratchpad
bind=ALT,z,toggle_scratchpad

# Retrieve window from scratchpad (restore)

# Jump back to the last opened tag
bind=SUPER,grave,view,-1

source=./dms/colors.conf
source=./dms/layout.conf
source=./dms/cursor.conf
source=./dms/outputs.conf
source=./dms/windowrules.conf
source=./dms/binds.conf

source=./dms/input.conf

# User override: Colemak (group1) + swapped-QWERTY backup (group2).
# Must stay AFTER all source= lines so it wins over any xkb_rules_*
# DMS regenerates into its fragments.
# Group2 is colemak_swap(us_backup) rather than plain us ON PURPOSE:
# a plain us group re-binds keycode <CAPS> to Lock group-wide and
# resurrects the Caps double-trigger bug.
# Swap in both groups, Lock bound ONLY to <BKSP> — verified via:
#   xkbcli compile-keymap --layout colemak_swap,colemak_swap --variant ,us_backup --options 'lv3:ralt_alt,grp:ralt_rshift_toggle'
xkb_rules_layout=colemak_swap,colemak_swap,us
xkb_rules_variant=,us_backup,
xkb_rules_options=lv3:ralt_alt,grp:ralt_rshift_toggle

